spring:
  application:
    name: spring-boot-rescue-lab
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rescue_lab}
    username: ${DB_USERNAME:rescue_lab}
    password: ${DB_PASSWORD:rescue_lab}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:rescue_lab}
    password: ${RABBITMQ_PASSWORD:rescue_lab}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${APP_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      roles: ADMIN
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Spring Boot Rescue Lab
    stage: inc-004-remediated

rescue-lab:
  idempotency:
    ttl: ${IDEMPOTENCY_TTL:PT24H}
    cleanup-initial-delay: ${IDEMPOTENCY_CLEANUP_INITIAL_DELAY:PT1M}
    cleanup-interval: ${IDEMPOTENCY_CLEANUP_INTERVAL:PT1H}
  security:
    alice-password: ${ALICE_PASSWORD:alice-change-me}
    bob-password: ${BOB_PASSWORD:bob-change-me}
    admin-password: ${ADMIN_PASSWORD:admin-change-me}
