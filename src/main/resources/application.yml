spring:
  application:
    name: spring-boot-rescue-lab
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rescue_lab}
    username: ${DB_USERNAME:rescue_lab}
    password: ${DB_PASSWORD:rescue_lab}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:rescue_lab}
    password: ${RABBITMQ_PASSWORD:rescue_lab}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${APP_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      roles: ADMIN
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: true

info:
  app:
    name: Spring Boot Rescue Lab
    stage: portfolio-release

rescue-lab:
  idempotency:
    ttl: ${IDEMPOTENCY_TTL:PT24H}
    cleanup-initial-delay: ${IDEMPOTENCY_CLEANUP_INITIAL_DELAY:PT1M}
    cleanup-interval: ${IDEMPOTENCY_CLEANUP_INTERVAL:PT1H}
  security:
    alice-password: ${ALICE_PASSWORD:alice-change-me}
    bob-password: ${BOB_PASSWORD:bob-change-me}
    admin-password: ${ADMIN_PASSWORD:admin-change-me}
  events:
    exchange: ${ORDER_EVENTS_EXCHANGE:rescue-lab.events}
    routing-key: ${ORDER_EVENTS_ROUTING_KEY:order.created}
    queue: ${ORDER_EVENTS_QUEUE:rescue-lab.order-events}
    dead-letter-exchange: ${ORDER_EVENTS_DLX:rescue-lab.events.dlx}
    dead-letter-routing-key: ${ORDER_EVENTS_DLQ_ROUTING_KEY:order.created.dead}
    dead-letter-queue: ${ORDER_EVENTS_DLQ:rescue-lab.order-events.dlq}
    consumer-enabled: ${ORDER_EVENTS_CONSUMER_ENABLED:true}
    confirm-timeout: ${ORDER_EVENTS_CONFIRM_TIMEOUT:PT5S}
    publisher:
      enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
      batch-size: ${OUTBOX_BATCH_SIZE:25}
      initial-delay: ${OUTBOX_INITIAL_DELAY:PT5S}
      interval: ${OUTBOX_INTERVAL:PT2S}
      retry-base: ${OUTBOX_RETRY_BASE:PT2S}
      retry-max: ${OUTBOX_RETRY_MAX:PT5M}


logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
